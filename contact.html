<!doctype html>
<html lang="en" class="h-full antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visit Us | Setty Mahal</title>
<meta name="description" content="Find the Setty Mahal showroom, opening hours and contact details.">
<link rel="stylesheet" href="styles.css">
</head>
<body class="flex min-h-full flex-col" data-page="contact">
<div id="site-header"></div>
<main class="flex-1" id="app">
  <div class="mx-auto max-w-6xl px-4 py-12">
    <h1 class="font-serif text-4xl font-bold text-wood-dark">Visit our showroom</h1>
    <div class="mt-8 grid gap-8 md:grid-cols-2">
      <div class="space-y-6">
        <div>
          <h2 class="text-sm font-semibold uppercase tracking-wider text-wood">Address</h2>
          <p class="mt-1 text-lg" data-site="address"></p>
        </div>
        <div>
          <h2 class="text-sm font-semibold uppercase tracking-wider text-wood">Hours</h2>
          <p class="mt-1 text-lg" data-site="hours"></p>
        </div>
        <div>
          <h2 class="text-sm font-semibold uppercase tracking-wider text-wood">Phone</h2>
          <a href="#" data-tel data-site="phoneDisplay" class="mt-1 block text-lg hover:underline"></a>
        </div>
        <div class="flex flex-wrap gap-3">
          <a href="#" data-wa target="_blank" rel="noopener noreferrer" class="rounded-full bg-[#25D366] px-6 py-3 font-semibold text-white hover:brightness-95">Chat on WhatsApp</a>
          <a href="#" data-maplink target="_blank" rel="noopener noreferrer" class="rounded-full border border-wood/30 px-6 py-3 font-semibold text-wood-dark hover:bg-sand">Open in Google Maps</a>
        </div>
      </div>
      <div id="map" class="aspect-[4/3] overflow-hidden rounded-xl border border-wood/10 bg-sand">
        <div class="flex h-full items-center justify-center p-6 text-center text-sm text-foreground/60">Map goes here. Paste the Google Maps embed link into mapEmbedUrl in data.js.</div>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
